<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Hyakuya の 小站">
  <defs>
    <!--
      辉光：以星为中心的径向暖光。
      峰值 42% 透明度、边缘完全消失 —— 底仍然是纯黑，
      但中心透出一层光，看起来像光源在徽章背后。
    -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <!-- 星本身的内发光：中心近白 → 边缘金，视觉上像在发光 -->
    <radialGradient id="ember" cx="0.5" cy="0.48" r="0.55">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.55" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </radialGradient>
    <!-- 辉光必须裁在圆角方块内，否则从四角溢出去 -->
    <clipPath id="badge">
      <rect width="32" height="32" rx="8"/>
    </clipPath>
    <!--
      轨道「前半段」的裁剪区：在旋转后的坐标系里取下半部分。
      用它把椭圆再描一遍压在星上面，于是环呈现
      「后半段藏在星后、前半段绕到星前」的穿插。
    -->
    <clipPath id="orbitFront">
      <rect x="0" y="16" width="32" height="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="32" height="32" fill="#000000"/>
    <circle cx="16" cy="16" r="15" fill="url(#halo)"/>

    <!-- 轨道：倾斜的椭圆，绕星「斜着转」。后半段（暗）先画，并带一颗暗卫星 -->
    <g transform="rotate(-28 16 16)">
      <ellipse cx="16" cy="16" rx="13.6" ry="5.8" fill="none"
               stroke="#f59e0b" stroke-opacity="0.22" stroke-width="0.34"/>
      <circle cx="9.2" cy="10.98" r="0.7" fill="#fbbf24" fill-opacity="0.45"/>
    </g>

    <!--
      四角星：四条二次曲线，控制点收在靠近中心的对角线上结成内凹尖角。
      尖端：上 5.0 / 下 27.0（R=11.0），左 6.8 / 右 25.2（R=9.2）
      控制点半径 3.4 —— 再大就退化成内凹菱形，失去"星"的锐度
    -->
    <path d="M16 5
             Q18.4 13.6 25.2 16
             Q18.4 18.4 16 27
             Q13.6 18.4 6.8 16
             Q13.6 13.6 16 5 Z"
          fill="url(#ember)"/>

    <!-- 轨道前半段：压在星上，亮一档，形成「绕到前面来」的错觉；前段挂一颗亮卫星 -->
    <g transform="rotate(-28 16 16)" clip-path="url(#orbitFront)">
      <ellipse cx="16" cy="16" rx="13.6" ry="5.8" fill="none"
               stroke="#fcd34d" stroke-opacity="0.62" stroke-width="0.34"/>
      <circle cx="22.8" cy="21.02" r="0.9" fill="#fde68a" fill-opacity="0.95"/>
    </g>
  </g>
</svg>
